[package]
name = "brasfoot-next"
version = "0.1.0"
edition = "2024"

[dependencies]
brasfoot-i18n.workspace = true
brasfoot-model.workspace = true
brasfoot-engine.workspace = true
brasfoot-persistence.workspace = true
brasfoot-simulation.workspace = true
brasfoot-systems.workspace = true
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window", "Storage"] }
log = "0.4"
web-time = "1.1"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot"] }
