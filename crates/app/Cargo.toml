[package]
name = "brasfoot-next"
version = "0.1.0"
edition = "2024"

[dependencies]
brasfoot-i18n.workspace = true
brasfoot-model.workspace = true
brasfoot-engine.workspace = true
brasfoot-persistence.workspace = true
brasfoot-simulation.workspace = true
brasfoot-systems.workspace = true
brasfoot-datapack.workspace = true
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
ehttp = { version = "0.7", features = ["native-async"] }
serde.workspace = true
serde_json.workspace = true
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "Element", "Event", "EventTarget", "HtmlCanvasElement", "IdbDatabase", "IdbFactory", "IdbObjectStore", "IdbOpenDbRequest", "IdbRequest", "IdbTransaction", "IdbTransactionMode", "Window", "Storage"] }
log = "0.4"

[dev-dependencies]
tempfile = "3.27.0"
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot"] }
