[package]
name = "brasfoot-datapack"
version.workspace = true
edition.workspace = true

[[bin]]
name = "brasfoot-data"
path = "src/bin/brasfoot-data.rs"

[dependencies]
brasfoot-model.workspace = true
brasfoot-persistence.workspace = true
brasfoot-simulation.workspace = true
csv = "1.4"
deunicode = "1.6"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
toml = "1.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
